name: Build Knowledge Graph

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Graphify
        run: |
          pip install graphifyy
          pip show graphifyy
      - name: Check graphify help
        run: graphify --help || python -m graphify --help
      - name: Run Graphify
        run: |
          echo "Current directory:"
          ls -la
          echo "Running graphify..."
          graphify . || python -m graphify . || graphify
      - name: List output
        run: ls -la graphify-out/ || echo "No graphify-out folder created"
      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          git commit -m "chore: update graphify index" || exit 0
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}